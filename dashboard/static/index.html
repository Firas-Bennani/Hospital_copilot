<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackCure — Hospital Copilot</title>
    <meta name="description" content="Supervision de clinique avec jumeau numérique 3D et agents IA (aide à la décision)">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Three.js (r128, global) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Chart.js (courbes des machines) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/platform.css">
</head>
<body>
    <!-- ═══ Barre du haut ═══ -->
    <header id="top-bar">
        <div class="top-bar-left">
            <div class="logo">
                <span class="logo-icon">🏥</span>
                <h1>HackCure</h1>
                <span class="logo-subtitle">Hospital Copilot</span>
            </div>
        </div>
        <div class="top-bar-center">
            <div id="mode-selector">
                <button id="btn-mode-demo" class="mode-btn active" data-mode="demo">
                    <span class="mode-icon">🎬</span> Mode démo
                </button>
                <button id="btn-mode-real" class="mode-btn" data-mode="real">
                    <span class="mode-icon">📡</span> Surveillance réelle
                </button>
            </div>
        </div>
        <div class="top-bar-right">
            <div class="top-anchor">
                <button id="btn-launch-demo" title="Jouer un scénario de démonstration">▶ Lancer la démo</button>
                <div id="demo-menu" class="hidden"></div>
            </div>
            <div class="top-anchor">
                <button id="notif-bell" class="icon-btn" title="Notifications">🔔<span id="notif-badge" class="notif-badge" data-count="0"></span></button>
                <div id="notif-dropdown" class="hidden"></div>
            </div>
            <div id="connection-status" class="status-disconnected">
                <span class="status-dot"></span>
                <span class="status-text">Déconnecté</span>
            </div>
            <div id="clock"></div>
            <div id="user-chip"></div>
            <button id="btn-logout" class="icon-btn" title="Déconnexion">⏻</button>
        </div>
    </header>

    <!-- ═══ Contenu principal ═══ -->
    <main id="app-container">
        <!-- Panneau gauche : navigation + cartes patients + contrôles de démo -->
        <aside id="sidebar">
            <nav id="main-nav"></nav>
            <div class="sidebar-header">
                <h2>Patients</h2>
                <span id="patient-count" class="badge">0</span>
            </div>
            <div id="patient-cards-container">
                <!-- Rempli dynamiquement -->
            </div>

            <!-- Contrôles de démo (visibles en mode démo) -->
            <div id="demo-controls" class="demo-panel">
                <h3>
                    <span class="demo-badge">SIMULATION</span>
                    Contrôles de démo
                </h3>
                <div id="demo-patient-select">
                    <label>Patient cible :</label>
                    <select id="demo-target-patient">
                        <!-- Rempli dynamiquement -->
                    </select>
                </div>
                <div class="demo-buttons">
                    <button class="demo-btn demo-btn-fall" data-event="fall">
                        ⚠️ Chute
                    </button>
                    <button class="demo-btn demo-btn-pain" data-event="pain">
                        😣 Douleur
                    </button>
                    <button class="demo-btn demo-btn-both" data-event="fall_and_pain">
                        🚨 Chute + douleur
                    </button>
                    <button class="demo-btn demo-btn-recover" data-event="recover">
                        ✅ Récupération
                    </button>
                </div>
                <div class="demo-actions">
                    <button id="btn-auto-demo" class="demo-btn demo-btn-auto">
                        ▶️ Séquence auto
                    </button>
                    <button id="btn-reset-all" class="demo-btn demo-btn-reset">
                        🔄 Tout réinitialiser
                    </button>
                </div>
            </div>
        </aside>

        <!-- Centre : viewport 3D (+ vues HTML par-dessus) -->
        <section id="viewport-container">
            <!-- Bannière d'alerte -->
            <div id="alert-banner" class="alert-hidden">
                <div class="alert-content">
                    <span class="alert-icon">🚨</span>
                    <span id="alert-text">ALERTE</span>
                    <button id="alert-dismiss" class="alert-close">✕</button>
                </div>
            </div>

            <!-- Indicateur de mode -->
            <div id="mode-indicator">
                <span id="mode-label">MODE DÉMO</span>
            </div>

            <!-- Canvas Three.js -->
            <div id="three-container"></div>

            <!-- Overlay CCTV -->
            <div id="cctv-overlay" class="cctv-hidden">
                <div class="cctv-scanlines"></div>
                <div class="cctv-static"></div>
                <div class="cctv-ui">
                    <div class="cctv-header">
                        <span class="cctv-rec"><span class="rec-dot"></span> REC</span>
                        <span class="cctv-cam">CAM <span id="cctv-cam-id">01</span></span>
                    </div>
                    <div class="cctv-footer">
                        <span class="cctv-date" id="cctv-date">2026/10/09</span>
                        <span class="cctv-time" id="cctv-time">16:00:00</span>
                    </div>
                    <div class="cctv-crosshair">
                        <div class="cross-h"></div>
                        <div class="cross-v"></div>
                    </div>
                </div>
            </div>

            <!-- Contrôles caméra -->
            <div id="camera-controls">
                <button id="btn-overview" class="cam-btn" title="Vue d'ensemble">🏠</button>
                <button id="btn-topdown" class="cam-btn" title="Vue de dessus">⬇️</button>
            </div>

            <!-- Bandeau KPI (mode 3D) -->
            <div id="kpi-bar"></div>

            <!-- Vue HTML affichée par-dessus le canvas (le canvas reste vivant) -->
            <div id="view-overlay" class="view-hidden">
                <div class="view-header">
                    <h2 id="view-title">Vue</h2>
                    <div class="view-header-actions">
                        <button id="view-close" class="btn btn-sm" title="Retour au jumeau 3D (Échap)">✕ Fermer</button>
                    </div>
                </div>
                <div id="view-body"></div>
            </div>
        </section>

        <!-- Panneau droit : Agents / Journal -->
        <aside id="event-panel">
            <div id="panel-tabs">
                <button class="panel-tab active" data-tab="agents">🤖 Agents</button>
                <button class="panel-tab" data-tab="journal">📜 Journal</button>
            </div>

            <section id="agents-panel" class="panel-section" data-tab="agents">
                <div class="agent-filters">
                    <select id="agent-filter-agent"><option value="">Tous les agents</option></select>
                    <select id="agent-filter-room"><option value="">Toutes les chambres</option></select>
                </div>
                <div id="agent-cards"></div>
                <div id="agent-feed" class="agent-feed"></div>
            </section>

            <section id="journal-panel" class="panel-section hidden" data-tab="journal" style="display:flex;flex-direction:column;flex:1;min-height:0">
                <div class="panel-header">
                    <h2>Journal des événements</h2>
                    <span id="event-count" class="badge">0</span>
                </div>
                <div id="event-list">
                    <div class="event-empty">Aucun événement</div>
                </div>

                <!-- Détail du patient sélectionné -->
                <div id="patient-detail" class="detail-hidden">
                    <h3>Détail patient</h3>
                    <div id="detail-content"></div>
                </div>
            </section>
        </aside>
    </main>

    <div id="toast-host"></div>

    <!-- Scripts existants (ordre conservé) -->
    <script src="/static/js/patient-state.js"></script>
    <script src="/static/js/scene.js"></script>
    <script src="/static/js/avatars.js"></script>
    <script src="/static/js/dashboard-ui.js"></script>
    <script src="/static/js/demo-controller.js"></script>
    <!-- Extensions plateforme -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/panel-tabs.js"></script>
    <script src="/static/js/staff-avatars.js"></script>
    <script src="/static/js/equipment.js"></script>
    <script src="/static/js/room-live.js"></script>
    <script src="/static/js/kpi-bar.js"></script>
    <script src="/static/js/views/devices.js"></script>
    <!-- Bootstrap WebSocket (existant) -->
    <script src="/static/js/app.js"></script>
</body>
</html>
